<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试木桩 DPR 工具</title>
<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --line: #d9e1ea;
    --ink: #1b2430;
    --muted: #5f6b7a;
    --accent: #1769aa;
    --accent-soft: #e8f1f9;
    --good: #1f7a4d;
    --warn: #9a6a00;
    --bad: #a03535;
    --chip: #eef1f5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: #123a5c;
    color: #fff;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .stats { display: flex; gap: 14px; margin-left: auto; font-size: 13px; }
  header .stats b { color: #ffd479; }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  .wrap {
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr) 330px;
    gap: 12px;
    padding: 12px 16px;
    align-items: start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }
  .panel h2 { margin: 0 0 8px; font-size: 14px; color: #123a5c; }
  .muted { color: var(--muted); font-size: 12px; }
  .hpbar, .apbar {
    height: 12px;
    background: #e3e8ee;
    border-radius: 6px;
    overflow: hidden;
    margin: 4px 0 8px;
  }
  .hpbar > div { height: 100%; background: #3ba55d; }
  .apbar > div { height: 100%; background: #f0b429; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 12px; }
  .kv span:last-child { font-weight: 600; }
  .team {
    display: grid;
    grid-template-columns: repeat(4, minmax(150px, 1fr));
    gap: 8px;
  }
  .char {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    background: #fbfcfe;
    position: relative;
  }
  .char h3 { margin: 0 0 4px; font-size: 14px; }
  .char .passion { font-size: 12px; color: var(--muted); }
  .char .dmg { font-size: 12px; margin-top: 4px; }
  .char .dmg b { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; min-height: 18px; }
  .chip {
    background: var(--chip);
    border: 1px solid #d8dee6;
    border-radius: 4px;
    font-size: 11px;
    padding: 1px 5px;
    color: #33404f;
  }
  .chip.blue { background: #e3effa; border-color: #b8d3ea; color: #155a91; }
  .chip.gold { background: #fdf3d8; border-color: #e7cf96; color: #7a5a00; }
  .chip.red { background: #fbe6e6; border-color: #e6b8b8; color: #8c2f2f; }
  .chip.green { background: #e4f4ea; border-color: #b7ddc8; color: #1f6e43; }
  .hand {
    display: grid;
    grid-template-columns: repeat(4, minmax(120px, 1fr));
    gap: 8px;
    margin: 10px 0;
  }
  .card {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    background: #fff;
    cursor: pointer;
    min-height: 92px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: box-shadow .12s;
  }
  .card:hover { box-shadow: 0 2px 8px rgba(18,58,92,.12); }
  .card.selected { outline: 2px solid var(--accent); }
  .card.moving { outline: 2px solid #d69e2e; }
  .card .skill-icon { position: absolute; top: 6px; right: 6px; bottom: 6px; width: auto; max-width: 64px; height: auto; object-fit: contain; border: 1px solid #d8dee6; border-radius: 6px; background: #fff; }
  .card .cname { font-size: 11px; color: var(--muted); padding-right: 68px; }
  .card .sname { font-weight: 600; font-size: 13px; padding-right: 68px; }
  .card .rank { font-size: 11px; color: #155a91; padding-right: 68px; }
  .card .actions { margin-top: auto; display: flex; gap: 4px; flex-wrap: wrap; padding-right: 68px; }
  .card .actions button { font-size: 11px; padding: 3px 6px; }
  .move-targets { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; align-items: center; }
  .move-targets button { font-size: 11px; padding: 3px 7px; }
  .actions-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .log {
    height: calc(100vh - 150px);
    min-height: 420px;
    overflow: auto;
    font-size: 12px;
    line-height: 1.5;
  }
  .log div { border-bottom: 1px dashed #e2e8ef; padding: 3px 2px; }
  .log .crit { color: var(--good); }
  .log .buff { color: var(--warn); }
  .config details { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .config label { display: block; font-size: 12px; margin: 5px 0 2px; color: var(--muted); }
  .config select, .config input {
    width: 100%;
    padding: 5px 6px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font: inherit;
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 8px 0;
  }
  .summary .cell {
    background: #fbfcfe;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
  }
  .summary .num { font-size: 20px; font-weight: 700; color: var(--accent); }
  .summary .lbl { font-size: 12px; color: var(--muted); }
  @media (max-width: 1100px) {
    .wrap { grid-template-columns: 1fr; }
    .team { grid-template-columns: repeat(2, 1fr); }
    .hand { grid-template-columns: repeat(2, 1fr); }
    .log { height: 300px; }
  }
  @media (max-width: 640px) {
    .team, .hand, .summary { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>测试木桩 DPR 工具</h1>
  <div class="stats">
    <span>回合 <b id="round">1</b></span>
    <span>行动点 <b id="ap">4/4</b></span>
    <span>全队总伤 <b id="total">0</b></span>
    <span>当前回合 <b id="roundDmg">0</b></span>
    <span>平均 DPR <b id="avgDpr">0</b></span>
  </div>
  <button class="primary" onclick="resetBattle()">重置战斗</button>
</header>

<div class="wrap">
  <aside class="panel">
    <h2>木桩</h2>
    <div id="dummyView"></div>
    <details class="config">
      <summary>木桩配置</summary>
      <label for="cfgDefR">现实防御</label><input id="cfgDefR" name="cfgDefR" type="number" value="1300">
      <label for="cfgDefM">精神防御</label><input id="cfgDefM" name="cfgDefM" type="number" value="1300">
      <label for="cfgCritRes">抗爆率 %</label><input id="cfgCritRes" name="cfgCritRes" type="number" value="0">
      <label for="cfgCritDef">暴击防御 %</label><input id="cfgCritDef" name="cfgCritDef" type="number" value="20">
      <label for="cfgTraumaRes">受创减免 %</label><input id="cfgTraumaRes" name="cfgTraumaRes" type="number" value="30">
      <label for="cfgAdv">克制系数 %</label><input id="cfgAdv" name="cfgAdv" type="number" value="30">
      <label for="cfgAfflatus">灵感</label>
      <select id="cfgAfflatus">
        <option value="智" selected>智</option>
        <option value="星">星</option>
        <option value="岩">岩</option>
        <option value="兽">兽</option>
        <option value="木">木</option>
        <option value="灵">灵</option>
      </select>
      <button class="primary" style="margin-top:8px" onclick="applyDummyConfig()">应用</button>
    </details>
    <div id="configPanel" class="config"></div>

    <h2>调律</h2>
    <label for="tuningSelect">调律选择</label>
    <select id="tuningSelect" onchange="setTuning(this.value)">
      <option value="unfinished">未尽的调律</option>
      <option value="initial">最初的刻度</option>
    </select>
    <div id="tuningPanel"></div>
  </aside>

  <main>
    <section class="panel">
      <h2>我方队伍</h2>
      <div class="team" id="teamView"></div>
      <div class="summary">
        <div class="cell"><div class="num" id="sumTeam">0</div><div class="lbl">本回合队伍总伤</div></div>
        <div class="cell"><div class="num" id="sumTotal">0</div><div class="lbl">累计总伤</div></div>
        <div class="cell"><div class="num" id="sumDpr">0</div><div class="lbl">本回合 DPR</div></div>
        <div class="cell"><div class="num" id="sumAvg">0</div><div class="lbl">平均 DPR</div></div>
      </div>
    </section>

    <section class="panel">
      <h2>手牌</h2>
      <div class="hand" id="handView"></div>
      <div class="actions-row">
        <button onclick="endTurn()" class="primary">结束回合</button>
        <button onclick="undoLast()" id="undoBtn" disabled>撤回上一步</button>
        <button onclick="clearLog()">清空日志</button>
        <button onclick="toggleDeck()">牌库查询</button>
        <span class="muted">打出 / 移动 / 相邻合成</span>
      </div>
      <div id="deckView" style="display:none" class="panel"></div>
    </section>

    <section class="panel">
      <h2>特殊行动</h2>
      <div class="btn-row" id="ultRow"></div>
    </section>
  </main>

  <aside class="panel">
    <h2>伤害日志</h2>
    <div class="log" id="logView"></div>
  </aside>
</div>

const LAST_PORTRAY = {};

function emptyStatus() { return {}; }

function addStatus(obj, id, stacks, dur) {
  if (!obj[id]) obj[id] = { stacks: 0, dur: 0 };
  obj[id].stacks += stacks || 0;
  obj[id].dur = Math.max(obj[id].dur, dur || 0);
}

function handLimit() {
  return S.tuning === "unfinished" ? 9 : 8;
}

function addTuningEnergy(n) {
  if (S && S.tuningEnergy !== undefined) S.tuningEnergy = Math.min(99, S.tuningEnergy + n);
}

function addPrepStacks(c, stacks, dur) {
  const obj = c.status;
  const id = "战备";
  if (!obj[id]) obj[id] = { stacks: 0, batches: [] };
  obj[id].batches.push({ stacks, dur });
  obj[id].stacks += stacks;
  // 超过 50：新覆盖旧，从最早获得的批次开始丢弃
  while (obj[id].stacks > 50 && obj[id].batches.length > 0) {
    const old = obj[id].batches.shift();
    obj[id].stacks = Math.max(0, obj[id].stacks - old.stacks);
  }
}

function makeChar(id, cfg) {
  const def = CHARACTERS[id];
  const ps = PSYCHUBES[def.defaultPsychube];
  const conf = cfg || {};
  const resCfg = conf.customRes || null;
  const c = {
    id, name: def.name, def,
    psychube: conf.psychube || def.defaultPsychube,
    resonanceMode: conf.resonanceMode || "r10",
    variant: conf.variant || "平和",
    portray: conf.portray !== undefined ? conf.portray : (LAST_PORTRAY[id] || 0),
    customRes: {
      flat: Object.assign({ atk: 0, hp: 0, defR: 0, defM: 0 }, resCfg ? resCfg.flat : {}),
      pct: Object.assign({ atk: 0, hp: 0, defR: 0, defM: 0, critRate: 0, critDmg: 0, traumaUp: 0, spellPower: 0, ritualPower: 0, pen: 0, critRes: 0, traumaRes: 0, critDef: 0 }, resCfg ? resCfg.pct : {})
    },
    passion: 0, maxPassion: def.maxPassion,
    energy: 0, status: emptyStatus(), buffs: { atkUp: { v: 0, d: 0 }, maxHpUp: { v: 0, d: 0 } },
    dmgRound: 0, dmgTotal: 0,
    stats: null
  };
  if (id === "xg") { c.passion = 3; addStatus(c.status, "筹备·虚构集", 1, 0); }
  if (id === "ran") {
    c.energy = c.portray >= 5 ? 100 : (c.portray >= 2 ? 85 : 70);
    c.passion = c.portray >= 1 ? 5 : 3;
    addStatus(c.status, "默契同调", 0, 0);
  }
  if (id === "mld") { addPrepStacks(c, 10, 2); }
  return c;
}

function refreshStats() {
  for (const c of S.team) {
    const def = c.def;
    const ps = PSYCHUBES[c.psychube];
    const rev = def.reverie ? def.reverie.stats : { atk: 0, hp: 0, defR: 0, defM: 0, ritualPower: 0, counterTrauma: 0 };
    const res = currentResonance(c);
    const useMainRes = c.resonanceMode !== "custom" && !!resonanceMain(c.id, c.resonanceMode === "r15" ? 15 : 10, c.variant);
    const baseAtk = def.base.atk + rev.atk;
    const baseHp = def.base.hp + rev.hp;
    const baseDefR = def.base.defR + rev.defR;
    const baseDefM = def.base.defM + rev.defM;
    let atk = baseAtk + ps.flat.atk + res.flat.atk + baseAtk * res.pct.atk / 100;
    let hp = baseHp + ps.flat.hp + res.flat.hp + baseHp * res.pct.hp / 100;
    let defR = baseDefR + ps.flat.defR + res.flat.defR + baseDefR * res.pct.defR / 100;
    let defM = baseDefM + ps.flat.defM + res.flat.defM + baseDefM * res.pct.defM / 100;
    if (ps.main.hp) hp += hp * ps.main.hp / 100;
    // 昨日雨声轻：百灵百验进战属性（增幅5）
    if (c.id === "ran" && c.psychube === "rain") {
      atk += baseAtk * ps.amp.startAtk / 100;
      hp += baseHp * ps.amp.startHp / 100;
    }
    const hpUp = c.buffs.maxHpUp.v;
    hp = Math.round(hp * (1 + hpUp / 100));
    let critRate = def.base.critTech / 3000 * 100 + res.pct.critRate;
    let critDmg = 130 + def.base.critTech / 2000 * 100 + res.pct.critDmg;
    critRate += ps.main.critRate || 0;
    let spellPower = 0, ritualPower = 0, traumaUp = 0, critDmgExtra = 0;
    if (c.id === "xg" && c.def.reverie) ritualPower += rev.ritualPower || 0;
    // 群鸟之歌（全队）
    spellPower += teamBuffTotal("spellPower");
    ritualPower += teamBuffTotal("ritualPower");
    traumaUp += teamBuffTotal("traumaUp") + teamBuffTotal("dmgUp");
    critDmgExtra += teamBuffTotal("critDmgUp");
    if (res.pct.spellPower) spellPower += res.pct.spellPower;
    if (res.pct.ritualPower) ritualPower += res.pct.ritualPower;
    if (res.pct.traumaUp) traumaUp += res.pct.traumaUp;
    // 武装整修（全队）/ 教条（莫莉德尔）
    const mldBuff = byId("mld");
    if (c.status["武装整修"]) critRate += mldBuff && mldBuff.portray >= 2 ? 40 : 30;
    if (c.id === "mld" && c.status["教条"]) ritualPower += c.portray >= 5 ? 30 : 20;
    // 在四方城外（额外行动后暴击创伤）
    if (c.psychube === "outside" && c.status["四方城"] && c.status["四方城"].stacks > 0) {
      const ps2 = PSYCHUBES.outside;
      critDmgExtra += ps2.amp.extraCritDmg * c.status["四方城"].stacks;
      if (c.status["四方城"].stacks >= ps2.amp.cap) critRate += ps2.amp.fullCritRate;
    }
    if (!useMainRes && c.resonanceMode !== "custom") {
      const tune = (TUNING_DELTA[c.id] || {})[c.variant] || { atk: 0, critRate: 0, critDmg: 0, traumaUp: 0, spellPower: 0, ritualPower: 0 };
      atk += tune.atk;
      critRate += tune.critRate;
      critDmg += tune.critDmg;
      traumaUp += tune.traumaUp;
      spellPower += tune.spellPower;
      ritualPower += tune.ritualPower;
    }
    if (c.id === "j" && c.status["燃烧"] && c.status["燃烧"].stacks > 0) {
      const furnaceRate = c.portray >= 5 ? 1.5 : (c.portray >= 2 ? 1 : 0.5);
      const furnaceMult = c.def.reverie ? 2 : 1;
      atk += atk * c.status["燃烧"].stacks * furnaceRate * furnaceMult / 100;
    }
    c.stats = {
      atk: Math.round(atk), maxHp: Math.round(hp), hp: Math.round(hp), defR: Math.round(defR), defM: Math.round(defM),
      critRate: round1(critRate), critDmg: round1(critDmg + critDmgExtra),
      spellPower: round1(spellPower), ritualPower: round1(ritualPower), traumaUp: round1(traumaUp)
    };
  }
  // 小瑞安侬的尘酿鹰依赖她的攻击，刷新两轮
  const ran = byId("ran");
  if (ran) {
    const ranRate = ran.portray >= 4 ? 0.10 : 0.08;
    const ranCapAtk = ran.portray >= 4 ? 310 : 250;
    const ranCapHp = ran.portray >= 4 ? 1550 : 1250;
    for (const c of S.team) {
      if (c.status["尘酿鹰"]) {
        c.stats.atk += Math.min(ranCapAtk, Math.round(ran.stats.atk * ranRate));
        c.stats.maxHp += Math.min(ranCapHp, Math.round(ran.stats.maxHp * ranRate));
      }
    }
  }
}

function round1(x) { return Math.round(x * 10) / 10; }
function byId(id) { return S.team.find(c => c.id === id); }
function dummy() { return S.dummy; }
function isAdvantage(att, def) { return AFFLATUS_ADV[att] === def; }

  const prevConfigs = S && S.team ? S.team.map(c => ({

    },

  };
  undoStack = [];
  if (prevDummy) {

    d.defR = prevDummy.defR;

  }
  S.deck = buildDeck();

  if (S.tuning === "unfinished" && S.hand.length > 0) {
    const firstDealt = [...S.hand].reverse().find(x => x.skillId !== "ult" && x.skillId !== "prep") || S.hand[S.hand.length - 1];
    S.hand.unshift(Object.assign({}, firstDealt, { uid: "start-extra-" + Math.random().toString(36).slice(2) }));

function buildDeck() {
  const deck = [];
  for (const id of ORDER) {
    for (const skill of CHARACTERS[id].skills) {
      for (let i = 0; i < 8; i++) deck.push({ charId: id, skillId: skill.id, rank: 1, uid: Math.random().toString(36).slice(2) });
    }
  }
  return deck;
}

function buildStartHand() {
  const cards = [];
  for (const id of ORDER) {
    for (const skill of CHARACTERS[id].skills) {
      cards.push({ charId: id, skillId: skill.id, rank: 1, uid: "start-" + Math.random().toString(36).slice(2) });
    }
  }
  shuffle(cards);
  const ults = [];
  for (const id of ORDER) {
    const c = S.team.find(x => x.id === id);
    if (c && c.passion >= 5) {
      ults.push({ charId: id, skillId: "ult", rank: 0, uid: "ult-" + Math.random().toString(36).slice(2) });
    }
  }
  const normalCount = Math.max(0, cards.length - ults.length);
  const dealtNormal = cards.slice(0, normalCount);
  return ults.concat(dealtNormal).reverse(); // 最先发的牌在最右侧
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function drawCards(n) {
  for (let i = 0; i < n; i++) {
    if (S.hand.length >= handLimit()) break;
    if (S.deck.length === 0) { S.deck = buildDeck(); shuffle(S.deck); }
    S.hand.unshift(S.deck.pop());
  }
}

function turnStart() {
  // 预备咒语：不占手牌上限、打出不耗行动点、下回合自动消失
  if (S.hand.some(x => x.skillId === "prep")) {
    S.hand = S.hand.filter(x => x.skillId !== "prep");
    log("虚构故事集 已消失（预备咒语下回合自动消失）", "buff");
  }

  // 行动点
  let ap = 4;
  const mld = byId("mld");
  if (mld && mld.status["连续行动Ⅰ"] && mld.status["连续行动Ⅰ"].dur > 0) {
    ap += 1;
    mld.status["连续行动Ⅰ"].dur -= 1;
    if (mld.status["连续行动Ⅰ"].dur <= 0) delete mld.status["连续行动Ⅰ"];
  }
  S.maxActionPoints = ap;
  S.actionPoints = ap;
  S.jCounterCount = 0;
  S.tuningUsed = { s1: 0, s2: 0 };

  if (S.tuning === "initial" && S.round > 1) addTuningEnergy(3);

  // 莫莉德尔战备阈值
  if (mld) {
    const zb = mld.status["战备"] ? mld.status["战备"].stacks : 0;
    if (zb >= 30) {
      for (const t of S.team) addStatus(t.status, "武装整修", 0, 1);
      log("莫莉德尔 武装整修：全队暴击率+" + (mld.portray >= 2 ? 40 : 30) + "%，溢出转暴击创伤");
    }
    if (zb >= 20) {
      for (const t of S.team) t.status["战备部署"] = { stacks: zb, dur: 1 };
      log("莫莉德尔 战备部署：按当前" + zb + "层战备，全队每层仪式伤害+" + (mld.portray >= 2 ? "2.5" : "2") + "%");
    }
    if (zb >= 10 && !mld.status["教条"]) { addStatus(mld.status, "主见", 0, 1); log("莫莉德尔 主见：免疫心神不宁"); }
    if (mld.status["教条"]) { log("莫莉德尔 教条中：无法获得主见"); }
  }

  // 小瑞安侬：默契同调 + 灵犀
  const ran = byId("ran");
  if (ran) {
    addStatus(ran.status, "默契同调", 2, 0);
    if (ran.status["默契同调"].stacks > 4) ran.status["默契同调"].stacks = 4;
    addLingxi(ran.portray >= 5 ? 2 : 1, 3);
  }

  // J 狂想：燃烧阈值
  const j = byId("j");
  if (j && j.status["燃烧"]) {
    const n = j.status["燃烧"].stacks;
    if (n >= 10) { addTeam("traumaResUp", "受创减免提高", n, 1); log("J 狂想：全队受创减免 +" + n + "%（1回合）"); }
    if (n >= 30) { addTeam("counterTrauma", "反击创伤加成提高", n, 1); log("J 狂想：全队反击创伤加成 +" + n + "%（1回合）"); }
  }

  // 大招卡优先发放：先发完全部激情满角色的大招，再补小技能
  const pendingUlts = S.team.filter(c => c.passion >= 5 && !S.hand.some(x => x.charId === c.id && x.skillId === "ult"));
  for (const c of pendingUlts) {
    if (S.hand.length >= handLimit()) {
      const idx = S.hand.findIndex(x => x.skillId !== "ult" && x.skillId !== "prep");
      if (idx < 0) break;
      const removed = S.hand.splice(idx, 1)[0];
      S.deck.push(removed);
      log(c.name + " 大招优先：移回一张普通牌腾出位置", "buff");
    }
    S.hand.unshift({ charId: c.id, skillId: "ult", rank: 0, uid: "ult-" + Math.random().toString(36).slice(2) });
    log(c.name + " 获得至终的仪式卡", "buff");
  }
  drawCards(Math.max(0, handLimit() - S.hand.length));

  // 虚构集：筹备·虚构集 -> 预备咒语（不占手牌上限，补牌后生成）
  const xg = byId("xg");
  if (xg && xg.status["筹备·虚构集"] && xg.status["筹备·虚构集"].stacks > 0) {
    while (xg.status["筹备·虚构集"].stacks > 0) {
      xg.status["筹备·虚构集"].stacks -= 1;
      S.hand.unshift({ charId: "xg", skillId: "prep", rank: 0, uid: "prep-" + Math.random().toString(36).slice(2) });
      log("虚构集 生成预备咒语：虚构故事集");
    }
  }

  autoMergeHand();
}

function teamBuffArr(key) {
  if (!Array.isArray(S.teamBuffs[key])) S.teamBuffs[key] = [];
  return S.teamBuffs[key];
}

function teamBuffTotal(key) {
  return teamBuffArr(key).reduce((sum, e) => sum + (e.d > 0 ? e.v : 0), 0);
}

function teamBuffEntry(key, name) {
  return teamBuffArr(key).find(e => e.name === name) || null;
}

function addTeam(key, name, v, d, opts) {
  const arr = teamBuffArr(key);
  const e = arr.find(x => x.name === name);
  if (!e) { arr.push({ name, v, d: d || 0 }); return; }
  if (opts && opts.named) {
    e.v = v;
    e.d = Math.max(e.d, d || 0);
  } else if (v > e.v) {
    e.v = v;
    e.d = d || 0;
  }
}

function addLingxi(n, dur) {
  const t = S.teamBuffs.lingxi;
  const ran = byId("ran");
  const cap = ran && ran.portray >= 5 ? 10 : (ran && ran.portray >= 2 ? 7 : 5);
  t.stacks = Math.min(cap, t.stacks + n);
  t.dur = Math.max(t.dur, dur || 0);
}

function calcHit(c, opts) {
  const st = c.stats;
  const dmy = dummy();
  const traumaType = opts.traumaType || c.def.trauma;
  const def = traumaType === "现实" ? dmy.defR : dmy.defM;
  const atkUp = c.buffs.atkUp.d > 0 ? c.buffs.atkUp.v / 100 : 0;
  const pen = 0;
  let atkDef = st.atk * (1 + atkUp) - def * (1 - pen);
  if (atkDef < st.atk * 0.1) atkDef = st.atk * 0.1;
  let traumaUp = st.traumaUp;
  if (opts.isUlt && c.status["战备部署"]) {
    const mld = byId("mld");
    const zb = c.status["战备部署"].stacks || 0;
    traumaUp += zb * (mld && mld.portray >= 2 ? 2.5 : 2);
  }
  if (opts.isCounter) traumaUp += teamBuffTotal("counterTrauma");
  let trauma = 1 + traumaUp / 100 - dmy.traumaRes / 100;
  if (trauma < 0.3) trauma = 0.3;
  const critRate = st.critRate - dmy.critRes;
  const crit = Math.random() * 100 < critRate;
  const dummyCritDef = dmy.critDef + (dmy.status["暴击防御降低"] ? dmy.status["暴击防御降低"].v || 0 : 0);
  let critDmg = st.critDmg - dummyCritDef;
  if (opts.isUlt && c.status["礼仪：暴击创伤"]) critDmg += c.status["礼仪：暴击创伤"].stacks * 3;
  const critTerm = crit ? Math.max(1, critDmg / 100) : 1;
  let power = 1;
  if (opts.isUlt) power += st.ritualPower / 100;
  else power += st.spellPower / 100;
  if (power < 1) power = 1;
  const advantaged = !!(opts.anyAdvantage || isAdvantage(c.def.afflatus, dmy.afflatus));
  const lingxi = S.teamBuffs.lingxi.stacks || 0;
  const lingxiRate = byId("ran") && byId("ran").portray >= 2 ? 5 : 4;
  const lingxiMult = lingxi * lingxiRate / 100;
  const advMult = 1 + (advantaged ? (dmy.adv || 30) / 100 + lingxiMult : 0);
  let affinity = 1;
  if (advantaged) affinity += (dmy.adv || 30) / 100 + lingxiMult;
  const finalTerm = 1 + S.finalUp / 100 - S.finalRes / 100;
  const mult = opts.mult + (opts.mainExtra || 0) + (opts.extraMult || 0) + (opts.overflowMult || 0);
  let dmg = (mult / 100) * atkDef * trauma * critTerm * power * affinity * finalTerm;
  dmg = Math.floor(dmg);
  return { dmg, crit, critRate: Math.max(0, Math.min(100, critRate)), critDmg: st.critDmg, affinity, power, trauma, atkDef, advantaged, advMult, lingxi };
}

function dealDamage(c, dmg, label, opts) {
  c.dmgRound += dmg; c.dmgTotal += dmg;
  S.roundDamage += dmg; S.totalDamage += dmg;
  dummy().hp = Math.max(0, dummy().hp - dmg);
  const lingxiText = opts && opts.lingxi ? "，灵犀" + opts.lingxi + "层" : "";
  const advText = opts && opts.advantaged !== undefined
    ? (opts.advantaged ? "（克制，系数×" + round1(opts.affinity || 1) + lingxiText + "）" : "（无克制，系数×" + round1(opts.affinity || 1) + lingxiText + "）")
    : "";
  log("【" + c.name + "】" + label + "：" + dmg + (opts && opts.crit ? "（暴击）" : "") + advText + psychubeHitSummary(c, opts));
}

function psychubeHitSummary(c, opts) {
  const ps = PSYCHUBES[c.psychube];
  if (!ps) return "";
  const parts = [];
  if (opts && (opts.isUlt || opts.psRit !== undefined) && c.psychube === "lastRoll" && c.id === "xg") {
    if (opts.psRit) parts.push("仪式威力+" + round1(opts.psRit) + "%");
    if (opts.psCrit) parts.push("暴击创伤+" + round1(opts.psCrit) + "%");
  }
  if (c.psychube === "outside" && c.status["四方城"] && c.status["四方城"].stacks > 0) {
    const stacks = c.status["四方城"].stacks;
    parts.push("暴击创伤+" + round1(ps.amp.extraCritDmg * stacks) + "%（四方城" + stacks + "层）");
    if (stacks >= ps.amp.cap) parts.push("暴击率+" + ps.amp.fullCritRate + "%");
  }
  if (c.psychube === "rain") {
    const dmg = teamBuffEntry("dmgUp", "昨日雨声轻");
    const crit = teamBuffEntry("critDmgUp", "昨日雨声轻");
    if (dmg && dmg.d > 0) parts.push("全队创伤加成+" + round1(dmg.v) + "%");
    if (crit && crit.d > 0) parts.push("全队暴击创伤+" + round1(crit.v) + "%");
  }
  if (c.psychube === "family") {
    const fam = teamBuffEntry("critDmgUp", "家庭指导员");
    if (fam && fam.d > 0) parts.push("全队暴击创伤+" + round1(fam.v) + "%（激情）");
  }
  if (!parts.length) return "";
  return "｜心相[" + ps.name + "]：" + parts.join("，");
}

function applyDummyStatus(id, stacks, dur) {
  const d = dummy();
  if (!d.status[id]) d.status[id] = { stacks: 0, dur: 0 };
  d.status[id].stacks += stacks;
  d.status[id].dur = Math.max(d.status[id].dur, dur || 0);
}

function applyExtract(c) {
  const st = dummy().status["激情萃取"];
  if (st && st.stacks > 0) {
    st.stacks -= 1;
    c.passion = Math.min(c.maxPassion, c.passion + 1);
    log("激情萃取：攻击者 " + c.name + " 激情+1", "buff");
  }
}

function log(msg, cls) {
  S.log.unshift({ msg, cls: cls || "" });
  if (S.log.length > 300) S.log.length = 300;
}

function playCard(uid) {
  const idx = S.hand.findIndex(x => x.uid === uid);
  if (idx < 0) return;
  const card = S.hand[idx];
  const c = byId(card.charId);
  if (!c) return;
  if (card.skillId === "universal") { log("万能卡不能直接打出", "buff"); return; }
  const isPrep = card.skillId === "prep";
  const isUlt = card.skillId === "ult";
  const skill = (isPrep || isUlt) ? null : c.def.skills.find(s => s.id === card.skillId);
  const apCost = isPrep ? 0 : ((c.id === "ran" && c.status["加护"]) ? 0 : 1);
  if (S.actionPoints < apCost) { log("行动点不足", "buff"); return; }
  pushUndo();
  S.actionPoints -= apCost;
  S.hand.splice(idx, 1);
  selectedCard = null;
  moveSource = null;
  c.passion = Math.min(c.maxPassion, c.passion + (isUlt ? 0 : 1));
  if (!isUlt) addTuningEnergy(4);
  if (isPrep) castStoryBook();
  else if (isUlt) castUltCard(c);
  else if (skill.type === "attack") castAttack(c, card, skill);
  else if (skill.type === "counter") castCounterSkill(c, card, skill);
  else castBuffSkill(c, card, skill);
  autoMergeHand();
  refreshStats();
  render();
}

function castAttack(c, card, skill, extraOpts) {
  const rank = card.rank;
  const hitOpts = extraOpts || {};
  if (c.id === "xg") {
    if (skill.id === "s1") {
      const r = calcHit(c, Object.assign({ mult: skill.mult[rank - 1] }, hitOpts));
      dealDamage(c, r.dmg, "字的隐喻 " + rankName(rank) + "阶", r);
      applyExtract(c);
      applyDummyStatus("激情萃取", 2, 0);
    } else {
      const mult = c.portray >= 4 ? [150, 225, 375][rank - 1] : skill.mult[rank - 1];
      const layers = c.portray >= 4 ? 10 : 5;
      const r = calcHit(c, Object.assign({ mult }, hitOpts));
      dealDamage(c, r.dmg, "词的意象 " + rankName(rank) + "阶", r);
      applyExtract(c);
      addStatus(c.status, "独白", layers, 0);
      capStacks(c, "独白", 40);
      log("虚构集 获得" + layers + "层独白（上限40）", "buff");
    }
  } else if (c.id === "mld") {
    const mult = c.portray >= 1 ? [150, 225, 375][rank - 1] : skill.mult[rank - 1];
    const r = calcHit(c, Object.assign({ mult }, hitOpts));
    dealDamage(c, r.dmg, "将过往摧毁 " + rankName(rank) + "阶", r);
    applyExtract(c);
    applyDummyStatus("激情萃取", 1, 0);
    addStatus(c.status, "连续行动Ⅰ", 0, c.portray >= 1 ? 2 : 1);
    log("莫莉德尔 获得连续行动Ⅰ：下回合行动点+1（持续" + (c.portray >= 1 ? 2 : 1) + "回合）", "buff");
  } else if (c.id === "ran") {
    castRanSkill(c, card, skill, rank);
  } else if (c.id === "j") {
    let mult = skill.mult[rank - 1];
    const reverie = !!c.def.reverie;
    let burn = 2;
    if (reverie) { mult += mult; burn = 6; }
    const r = calcHit(c, Object.assign({ mult }, hitOpts, reverie ? { isCounter: true } : {}));
    dealDamage(c, r.dmg, "硬度测试 " + rankName(rank) + "阶", r);
    applyExtract(c);
    applyDummyStatus("燃烧", burn, 0);
    addStatus(c.status, "燃烧", burn, 0);
    capStacks(c, "燃烧", c.portray >= 3 ? 45 : 35);
    log("J 施加" + burn + "层燃烧（目标/自身），视为反击", "buff");
    if (reverie && c.psychube === "outside") {
      addStatus(c.status, "四方城", 1, 0);
      log("在四方城外：暴击创伤 +" + PSYCHUBES.outside.amp.extraCritDmg + "%（" + c.status["四方城"].stacks + "/10）", "buff");
    }
  }
}

function castCounterSkill(c, card, skill) {
  if (c.id === "mld") {
    const n = [2, 3, 5][card.rank - 1];
    addPrepStacks(c, n, 3);
    if (c.status["主见"]) { addStatus(c.status, "攻坚", 0, 1); log("莫莉德尔 获得攻坚：受击后大招反击", "buff"); }
    else { addStatus(c.status, "闪击", 0, 1); log("莫莉德尔 获得闪击：受击后反制将过往摧毁", "buff"); }
    log("莫莉德尔 战备 +" + n, "buff");
  } else if (c.id === "j") {
    const n = [1.0, 1.5, 2.5][card.rank - 1];
    for (const t of S.team) addStatus(t.status, "热处理护盾", 0, 2);
    log("J 热处理：全队获得护盾（攻击×" + Math.round(n * 100) + "% + 燃烧加成），受击后高温回火反击", "buff");
  }
}

function castBuffSkill(c, card, skill) {
  if (c.id === "ran" && skill.id === "s2") {
    consumeTuning(c);
    const birdPower = c.portray >= 1 ? 45 : 30;
    addTeam("spellPower", "群鸟之歌", birdPower, 3, { named: true });
    addTeam("ritualPower", "群鸟之歌", birdPower, 3, { named: true });
    log("小瑞安侬 全队获得群鸟之歌：术法/仪式威力+" + birdPower + "%（3回合）", "buff");
    const hpUp = [12, 13, 14][card.rank - 1];
    c.buffs.maxHpUp = { v: hpUp, d: 3 };
    if (c.status["加护"]) {
      const lingxiStacks = S.teamBuffs.lingxi.stacks || 0;
      const baseUp = c.portray >= 3 ? 20 : 15;
      const maxExtra = c.portray >= 3 ? 21 : 15;
      const extra = Math.min(maxExtra, lingxiStacks * 3);
      addTeam("traumaUp", "加护", baseUp + extra, 3, { named: true });
      log("小瑞安侬·加护：全队创伤加成 +" + (baseUp + extra) + "%（3回合）", "buff");
    }
    afterRanSpell();
  }
}

function castRanSkill(c, card, skill, rank) {
  consumeTuning(c);
  const amp = c.status["加护"];
  const mult = amp ? skill.multAmp[rank - 1] : skill.mult[rank - 1];
  const r = calcHit(c, { mult });
  dealDamage(c, r.dmg, (amp ? "囫囵吞咒·加护 " : "囫囵吞咒 ") + rankName(rank) + "阶", r);
  applyExtract(c);
  c.buffs.atkUp = { v: [12, 13, 14][rank - 1], d: 3 };
  if (amp) {
    const lingxiStacks = S.teamBuffs.lingxi.stacks || 0;
    const baseDebuff = c.portray >= 3 ? 20 : 15;
    const maxExtra = c.portray >= 3 ? 21 : 15;
    const extra = Math.min(maxExtra, lingxiStacks * 3);
    applyDummyStatus("暴击防御降低", 0, 3);
    dummy().status["暴击防御降低"].v = Math.max(dummy().status["暴击防御降低"].v || 0, baseDebuff + extra);
    log("小瑞安侬·加护：木桩暴击防御降低 " + (baseDebuff + extra) + "%（3回合）", "buff");
  }
  afterRanSpell();
}

function consumeTuning(c) {
  if (!c.status["默契同调"] || c.status["默契同调"].stacks <= 0) return;
  c.status["默契同调"].stacks -= 1;
  const energyGain = c.portray >= 5 ? 12.5 : (c.portray >= 2 ? 10 : 8);
  const lingxiGain = c.portray >= 5 ? 4 : (c.portray >= 2 ? 3 : 2);
  c.energy = Math.min(150, c.energy + energyGain);
  addLingxi(lingxiGain, 3);
  log("小瑞安侬 默契同调：使役通感 +" + energyGain + "%，灵犀 +" + lingxiGain, "buff");
}

function afterRanSpell() {
  if (byId("ran").psychube === "rain") {
    const v = PSYCHUBES.rain.amp.spellTeamDmg;
    const cur = teamBuffEntry("dmgUp", "昨日雨声轻");
    const base = cur && cur.d > 0 ? cur.v / v : 0;
    const newV = Math.min(6, base + 1) * v;
    addTeam("dmgUp", "昨日雨声轻", newV, 3, { named: true });
    log("昨日雨声轻：全队创伤加成 +" + newV + "%（3回合）", "buff");
  }
}

function skillIconFile(name) {

function capStacks(c, id, cap) {
  if (c.status[id] && c.status[id].stacks > cap) c.status[id].stacks = cap;
}

function consumeRitualLayers(c) {
  if (c.status && c.status["礼仪：暴击创伤"]) {
    delete c.status["礼仪：暴击创伤"];
    log(c.name + " 消耗【礼仪：暴击创伤】", "buff");
  }
}

function castUltCard(c) {
  if (!c || c.passion < 5) return;
  const cost = c.id === "xg" ? c.passion : 5;
  c.passion -= cost;
  onPassionSpent(c, cost);

  if (c.id === "xg") castXgUlt(c, cost);
  else if (c.id === "mld") castMldUlt(c);
  else if (c.id === "j") castJUlt(c);
  else if (c.id === "ran") castRanUlt(c);
  consumeRitualLayers(c);

  // 其他友方释放仪式 -> 虚构集被动
  if (c.id !== "xg") {
    const xg = byId("xg");
    xg.passion = Math.min(xg.maxPassion, xg.passion + 1);
    if ((c.def.ult.target || "aoe") === "single") {
      addStatus(xg.status, "独白", cost, 0);
      capStacks(xg, "独白", 40);
      log("虚构集 自动写作法：激情+1，获得" + cost + "层独白", "buff");
    } else {
      addStatus(xg.status, "群像", cost, 0);
      capStacks(xg, "群像", 40);
      log("虚构集 自动写作法：激情+1，获得" + cost + "层群像", "buff");
    }
  }
  refreshStats();
  render();
}

function onPassionSpent(c, amount) {
  const mld = byId("mld");
  if (mld) {
    addPrepStacks(mld, amount, 3);
    log("莫莉德尔 战备 +" + amount, "buff");
  }
  const mldPs = byId("mld") && byId("mld").psychube === "family" ? PSYCHUBES.family : null;
  if (mldPs) {
    const v = mldPs.amp.passionCrit;
    const t = teamBuffEntry("critDmgUp", "家庭指导员");
    const base = t && t.d > 0 ? t.v / v : 0;
    const newV = Math.min(mldPs.amp.cap, base + amount) * v;
    const newD = t ? Math.max(t.d, 1) : 1;
    addTeam("critDmgUp", "家庭指导员", newV, newD, { named: true });
    log("家庭指导员：全队暴击创伤 +" + newV + "%", "buff");
  }
}

function castXgUlt(c, cost) {
  const d = c.status["独白"] ? c.status["独白"].stacks : 0;
  const g = c.status["群像"] ? c.status["群像"].stacks : 0;
  const baseMult = c.portray >= 5 ? 650 : (c.portray >= 3 ? 550 : c.def.ult.mult);
  const baseExtra = c.portray >= 5 ? 650 : (c.portray >= 3 ? 550 : c.def.ult.mainExtra);
  // 狂想Ⅱ的“基础现实创伤100%”跟随当前塑造后的基础倍率，而不是固定450%
  let mult = baseMult + (c.def.reverie ? baseMult : 0);
  let mainExtra = baseExtra + (c.def.reverie ? baseExtra : 0);
  const basePerD = c.portray >= 2 ? 70 : 50;
  const basePerG = c.portray >= 2 ? 35 : 25;
  const perD = c.def.reverie ? basePerD * 2 : basePerD;
  const perG = c.def.reverie ? basePerG * 2 : basePerG;
  const stackMain = d * perD + g * perG;
  const stackAoe = g * perG;
  const extra = Math.max(0, cost - 5);
  const ritualBase = c.portray >= 5 ? 6 : 3;
  const ritualBonus = ritualBase * (c.def.reverie ? 2 : 1);
  const ps = PSYCHUBES[c.psychube];
  const lastRollBonus = ps.id === "lastRoll" ? ps.amp.ritPerPassion * cost : 0;
  const xgBonus = extra * ritualBonus;
  const totalRitBonus = lastRollBonus + xgBonus;
  const doubleRit = extra >= 5; // 10激情时威力翻倍
  const appliedRitBonus = doubleRit ? totalRitBonus * 2 : totalRitBonus;
  const psRit = lastRollBonus;
  const oldRitual = c.stats.ritualPower;
  c.stats.ritualPower += appliedRitBonus;
  let critBuff = 0;
  if (ps.id === "lastRoll") {
    critBuff = Math.min(ps.amp.cap, cost) * ps.amp.critPerPassion;
    c.stats.critDmg += critBuff;
  }
  const r = calcHit(c, { mult, mainExtra: mainExtra + stackMain, extraMult: stackAoe, isUlt: true });
  dealDamage(c, r.dmg, "下现实主义迷宫", Object.assign({}, r, { isUlt: true, psRit, psCrit: critBuff }));
  applyExtract(c);
  c.stats.ritualPower = oldRitual;
  c.stats.critDmg -= critBuff;
  const consumed = d + g;
  c.status["独白"] = { stacks: 0, dur: 0 };
  c.status["群像"] = { stacks: 0, dur: 0 };
  const prepGain = Math.floor(consumed / 10);
  if (prepGain > 0) {
    const maxPrep = c.portray >= 1 ? 2 : 1;
    addStatus(c.status, "筹备·虚构集", Math.min(maxPrep, prepGain), 0);
    capStacks(c, "筹备·虚构集", maxPrep);
    log("虚构集 筹备·虚构集 +" + prepGain + "（上限" + maxPrep + "）", "buff");
  }
  distributeUltPassion(extra);
  log("虚构集 大招：独白" + d + " 群像" + g + "，额外激情" + extra + "，仪式威力+" + round1(appliedRitBonus) + "%（心相" + round1(lastRollBonus) + "% + 自身" + round1(xgBonus) + "%" + (doubleRit ? "，10激情翻倍" : "") + "）", "buff");
}

function distributeUltPassion(extra) {
  const allies = S.team.filter(x => x.id !== "xg");
  for (let k = 0; k < extra; k++) {
    let target = null;
    for (const a of allies) {
      if (a.passion >= a.maxPassion) continue;
      if (!target || a.passion < target.passion) target = a;
    }
    if (!target) break;
    target.passion += 1;
    log("虚构集 大招返还： " + target.name + " 激情+1", "buff");
  }
}

function castMldUlt(c, viaStory, asCounter) {
  const multBase = c.portray >= 4 ? 500 : c.def.ult.mult;
  const activeExtra = c.portray >= 5 ? 600 : c.def.ult.activeExtra;
  let mult = multBase + (viaStory ? 0 : activeExtra);
  const r = calcHit(c, Object.assign({ mult, isUlt: true }, asCounter ? { isCounter: true } : {}));
  dealDamage(c, r.dmg, "不再迷失的归途者（主动）", r);
  applyExtract(c);

function castJUlt(c) {
  const burn = c.status["燃烧"] ? c.status["燃烧"].stacks : 0;
  const old = dummy().status["燃烧"] ? dummy().status["燃烧"].stacks : 0;
  const overflow = Math.max(0, old + burn - 30);
  applyDummyStatus("燃烧", burn, 0);
  if (dummy().status["燃烧"].stacks > 30) dummy().status["燃烧"].stacks = 30;
  let mult = c.def.ult.mult;
  if (c.portray >= 4) mult = 450;
  let overMult = 0;
  if (c.def.reverie) {
    mult += mult;
    // 游戏当前 bug：狂想Ⅲ溢出额外倍率被双倍计算，按实际表现 0塑 100%/层、塑造4 150%/层
    overMult = overflow * (c.portray >= 4 ? 150 : 100);
    const traumaV = Math.min(99, burn * 2.5);
    addTeam("traumaUp", "创伤加成提高", traumaV, 3);
    log("J 狂想：全队创伤加成 +" + traumaV + "%（3回合）", "buff");
  } else {
    overMult = overflow * (c.portray >= 4 ? 15 : 10);
  }
  const r = calcHit(c, { mult, overflowMult: overMult, isUlt: true });
  dealDamage(c, r.dmg, "飞跃海特街！" + (overflow ? "（溢出" + overflow + "层）" : ""), r);
  applyExtract(c);
  log("J 大招：赋予木桩" + burn + "层燃烧，溢出" + overflow + "层", "buff");
}

function castRanUlt(c) {

function castStoryBook() {
  const xg = byId("xg");
  let target = S.team.filter(x => x.id !== "xg").sort((a, b) => b.passion - a.passion)[0];
  if (!target) return;
  const cost = target.passion;
  target.passion = 0;
  onPassionSpent(target, cost);
  if (target.id === "mld") castMldUlt(target, true);
  else if (target.id === "j") castJUlt(target);
  else if (target.id === "ran") castRanUltFromStory(target);
  consumeRitualLayers(target);
  target.passion = Math.min(target.maxPassion, cost); // 回复消耗的激情（上限为释放所需）
  xg.passion = Math.min(xg.maxPassion, xg.passion + 1);
  const reverieMult = xg.def.reverie ? 2 : 1;
  const gain = cost * reverieMult;
  if ((target.def.ult.target || "aoe") === "single") {
    addStatus(xg.status, "独白", gain, 0);
    capStacks(xg, "独白", 40);
    log("虚构故事集：" + target.name + " 消耗" + cost + "点激情释放单体仪式，随后回复；虚构集获得" + gain + "层独白" + (reverieMult > 1 ? "（狂想翻倍）" : ""), "buff");
  } else {
    addStatus(xg.status, "群像", gain, 0);
    capStacks(xg, "群像", 40);
    log("虚构故事集：" + target.name + " 消耗" + cost + "点激情释放群体仪式，随后回复；虚构集获得" + gain + "层群像" + (reverieMult > 1 ? "（狂想翻倍）" : ""), "buff");
  }
}

function endTurn() {
  undoStack = [];
  S.hand = S.hand.filter(x => !x.tuningTemp);

  // 回合结束结算
  const dmy = dummy();
  const j = byId("j");
  if (dmy.status["燃烧"] && j) {
    const n = dmy.status["燃烧"].stacks;
    const burnDmg = Math.floor(n * j.stats.atk * 0.04);
    if (burnDmg > 0) {
      dealDamage(j, burnDmg, "燃烧结算（木桩" + n + "层）");
      dmy.status["燃烧"].stacks = Math.floor(n / 2);
    }
  }
  const ran = byId("ran");
  if (ran && ran.status["默契同调"] && ran.status["默契同调"].stacks > 0) {
    // 先于发牌结算：靠默契同调补满激情后，回合开始发牌阶段会正常发放大招卡
    ran.status["默契同调"].stacks -= 1;
    ran.passion = Math.min(ran.maxPassion, ran.passion + 1);
    log("小瑞安侬 回合结束：默契同调换激情+1", "buff");
  }
  if (!S.extraRound) dummyAttack();
  tickStatuses();

  if (S.extraRound) {
    // 超凡五感收尾：追加虫虫黑莓唤回术
    const ran2 = byId("ran");
    const lingxi = S.teamBuffs.lingxi.stacks || 0;
    const blackberryBase = ran2.portray >= 5 ? 5000 : (ran2.portray >= 2 ? 3000 : 1500);
    const blackberryPerLingxi = ran2.portray >= 5 ? 500 : (ran2.portray >= 2 ? 300 : 150);
    const r = calcHit(ran2, { mult: blackberryBase + lingxi * blackberryPerLingxi, anyAdvantage: true, isUlt: false });
    dealDamage(ran2, r.dmg, "虫虫黑莓唤回术（灵犀" + lingxi + "层）", r);
    applyExtract(ran2);
    S.extraRound = false;
    turnStart();
    log("超凡五感额外回合结束，正常开始新回合（回合数不变）", "buff");
  } else {
    S.history.push(S.roundDamage);
    S.round += 1;
    for (const c of S.team) c.dmgRound = 0;
    S.roundDamage = 0;
    turnStart();
  }
  refreshStats();
  render();
}

function castJCounter(c) {
  const reverie = !!c.def.reverie;
  const base = c.portray >= 1 ? 40 : 30;
  // 狂想Ⅳ：不再按已损生命增伤，改为每层燃烧按原损血增伤的 50% 计算
  const lostHpBonus = c.portray >= 1 ? 15 : 10;
  let mult = base;
  if (reverie) {
    const burn = c.status["燃烧"] ? c.status["燃烧"].stacks : 0;
    // 狂想Ⅳ的 900% 是基础倍率的 900%，即额外 +base*9
    mult += base * 9 + burn * (lostHpBonus * 0.5);
  }
  log("J 高温回火反击（护盾队友受击）", "buff");
  const r = calcHit(c, { mult, isCounter: true });
  dealDamage(c, r.dmg, "高温回火", r);
  applyDummyStatus("燃烧", 2, 0);
  addStatus(c.status, "燃烧", 2, 0);
  capStacks(c, "燃烧", c.portray >= 3 ? 45 : 35);
  if (reverie) {
    for (const t of S.team) addStatus(t.status, "热处理护盾", 0, 3);
  }
  if (reverie && S.jCounterCount < 2) {
    S.jCounterCount += 1;
    c.passion = Math.min(c.maxPassion, c.passion + 1);
    log("J 狂想：反击后激情+1（" + S.jCounterCount + "/2）", "buff");
  }
}

function tickStatuses() {
  for (const c of S.team) {
    for (const k of Object.keys(c.status)) {
      const st = c.status[k];
      if (k === "连续行动Ⅰ") continue;
      if (k === "战备" && st.batches) {
        st.batches = st.batches.filter(b => {
          b.dur -= 1;
          return b.dur > 0;
        });
        st.stacks = st.batches.reduce((sum, b) => sum + b.stacks, 0);
        if (st.stacks <= 0) delete c.status[k];
        continue;
      }
      if (st.dur > 0) {
        st.dur -= 1;
        if (st.dur <= 0 && !["独白", "群像", "筹备·虚构集", "默契同调", "燃烧", "礼仪：暴击创伤", "四方城"].includes(k)) delete c.status[k];
      }
    }
    for (const b of Object.keys(c.buffs)) {
      if (c.buffs[b].d > 0) { c.buffs[b].d -= 1; if (c.buffs[b].d <= 0) c.buffs[b].v = 0; }
    }
  }
  for (const k of Object.keys(S.teamBuffs)) {
    const st = S.teamBuffs[k];
    if (Array.isArray(st)) {
      for (let i = st.length - 1; i >= 0; i--) {
        const e = st[i];
        e.d -= 1;
        if (e.d <= 0) st.splice(i, 1);
      }
    } else if (st && st.d > 0) {
      st.d -= 1;
      if (st.d <= 0) { st.v = 0; if (k === "lingxi") st.stacks = 0; }
    }
  }
  const dmy = dummy();
  for (const k of Object.keys(dmy.status)) {
    const st = dmy.status[k];
    if (st.dur > 0) { st.dur -= 1; if (st.dur <= 0) delete dmy.status[k]; }
  }
}

function mergeCards(uidA, uidB) {
  const ia = S.hand.findIndex(x => x.uid === uidA);
  const ib = S.hand.findIndex(x => x.uid === uidB);
  if (ia < 0 || ib < 0 || Math.abs(ia - ib) !== 1) { log("合成需要两张相邻的卡牌", "buff"); return; }
  const a = S.hand[ia];
  const b = S.hand[ib];
  const uni = a.skillId === "universal" ? a : (b.skillId === "universal" ? b : null);
  if (uni) {
    const other = uni === a ? b : a;
    if (!other || other.skillId === "ult" || other.skillId === "prep" || other.skillId === "universal" || other.rank !== 1) return;
    const oc = byId(other.charId);
    other.rank += 1;
    delete other.tuningTemp;
    S.hand = S.hand.filter(x => x.uid !== uni.uid);
    selectedCard = null;
    moveSource = null;
    log((oc ? oc.name : "") + " 万能卡合成：" + (oc ? oc.def.skills.find(s => s.id === other.skillId).name : "") + " 升至" + rankName(other.rank) + "阶", "buff");
    render();
    return;
  }
  if (a.charId !== b.charId || a.skillId !== b.skillId || a.rank !== b.rank || a.rank >= 3) return;
  const c = byId(a.charId);
  c.passion = Math.min(c.maxPassion, c.passion + 1);
  a.rank += 1;
  delete a.tuningTemp;
  addTuningEnergy(S.tuning === "initial" ? 2 : 5);
  S.hand = S.hand.filter(x => x.uid !== uidB);
  selectedCard = null;
  moveSource = null;
  log(c.name + " 合成：" + c.def.skills.find(s => s.id === a.skillId).name + " 升至" + rankName(a.rank) + "阶，激情+1", "buff");
  render();
}

function autoMergeHand() {
  for (let i = 0; i < S.hand.length - 1; i++) {
    const a = S.hand[i];
    const b = S.hand[i + 1];
    if (a && b && a.skillId !== "ult" && a.skillId !== "prep" && a.rank < 3 &&
        a.charId === b.charId && a.skillId === b.skillId && a.rank === b.rank) {
      const before = S.hand.length;
      mergeCards(a.uid, b.uid);
      if (S.hand.length < before) autoMergeHand();
      return;
    }
  }
}

function canMergeWith(uid) {
  const i = S.hand.findIndex(x => x.uid === uid);
  const card = S.hand[i];
  if (!card || card.rank >= 3 || card.skillId === "ult" || card.skillId === "prep") return null;
  for (const j of [i - 1, i + 1]) {
    const other = S.hand[j];
    if (!other) continue;
    if (card.skillId === "universal") {
      if (other.skillId !== "ult" && other.skillId !== "prep" && other.skillId !== "universal" && other.rank === 1) return other;
    } else if (other.skillId === "universal") {
      if (card.skillId !== "ult" && card.skillId !== "prep" && card.rank === 1) return other;
    } else if (other.charId === card.charId && other.skillId === card.skillId && other.rank === card.rank) {
      return other;
    }
  }
  return null;
}

function statusChips(c) {
  const parts = [];
  if (c.portray > 0) parts.push('<span class="chip gold">塑造' + c.portray + '</span>');
  for (const k of Object.keys(c.status)) {
    const st = c.status[k];
    if (!st) continue;
    if (["独白", "群像", "筹备·虚构集", "战备", "礼仪：暴击创伤", "四方城"].includes(k) && st.stacks > 0) {
      parts.push('<span class="chip blue">' + STATUS_NAMES[k] + "×" + st.stacks + '</span>');
    } else if (k === "战备部署" && st.stacks > 0) {
      parts.push('<span class="chip gold">战备部署×' + st.stacks + '</span>');
    } else if (["加护", "主见", "攻坚", "闪击", "教条", "连续行动Ⅰ", "武装整修", "热处理护盾"].includes(k)) {
      parts.push('<span class="chip gold">' + STATUS_NAMES[k] + '</span>');
    } else if (k === "默契同调" && st.stacks > 0) {
      parts.push('<span class="chip green">默契同调×' + st.stacks + '</span>');
    } else if (k === "尘酿鹰") {
      parts.push('<span class="chip green">尘酿鹰</span>');
    } else if (k === "燃烧" && st.stacks > 0) {
      parts.push('<span class="chip red">燃烧×' + st.stacks + '</span>');
    }
  }
  if (c.id === "ran") parts.push('<span class="chip gold">使役通感 ' + Math.floor(c.energy) + '%</span>');
  return parts.join("") + teamBuffChips();
}

function teamBuffChips() {
  const parts = [];
  const areas = ["traumaUp", "dmgUp", "spellPower", "ritualPower", "critDmgUp", "traumaResUp", "counterTrauma"];
  const areaLabels = {
    traumaUp: "创伤", dmgUp: "创伤", spellPower: "术法", ritualPower: "仪式",
    critDmgUp: "暴创", traumaResUp: "受创减免", counterTrauma: "反击创伤"
  };
  for (const key of areas) {
    for (const e of teamBuffArr(key)) {
      if (e.d > 0) parts.push('<span class="chip blue">' + escapeHtml(e.name) + '（' + areaLabels[key] + '）+' + round1(e.v) + '%·' + e.d + '回合</span>');
    }
  }
  return parts.join("");
}

function startMove(uid) {
  const card = S.hand.find(x => x.uid === uid);
  const freeMove = card && card.skillId === "universal";
  if (!freeMove && S.actionPoints < 1) { log("行动点不足", "buff"); return; }
  moveSource = uid;
  selectedCard = null;
  render();
}

function cancelMove() {
  moveSource = null;
  render();
}

function moveTo(uid, targetIndex) {
  if (moveSource !== uid) return;
  const i = S.hand.findIndex(x => x.uid === uid);
  if (i < 0) return;
  const card = S.hand[i];
  const freeMove = card.skillId === "universal";
  if (!freeMove && S.actionPoints < 1) { log("行动点不足", "buff"); return; }
  let t = targetIndex;
  if (t > i) t -= 1;
  if (t === i) { moveSource = null; render(); return; }
  pushUndo();
  const [moved] = S.hand.splice(i, 1);
  S.hand.splice(Math.max(0, Math.min(t, S.hand.length)), 0, card);
  if (!freeMove) {
    S.actionPoints -= 1;
    if (card.skillId !== "ult") addTuningEnergy(3);
  }
  const c = card.charId ? byId(card.charId) : null;
  if (!freeMove && c) c.passion = Math.min(c.maxPassion, c.passion + 1);
  const who = c ? c.name : "万能卡";
  const other = canMergeWith(card.uid);
  if (other) {
    log(who + " 移动卡牌到第" + (t + 1) + "位" + (freeMove ? "" : "，激情+1"), "buff");
    mergeCards(card.uid, other.uid);
    return;
  }
  moveSource = null;
  log(who + " 移动卡牌到第" + (t + 1) + "位" + (freeMove ? "" : "，激情+1"), "buff");
  render();
}

function selectCard(uid) {
  if (moveSource) { moveSource = null; render(); return; }
  selectedCard = selectedCard === uid ? null : uid;
  render();
}

function tryMerge(uid) {
  const other = canMergeWith(uid);
  if (!other) { log("需要相邻的同阶同技能卡牌才能合成", "buff"); return; }
  pushUndo();
  mergeCards(uid, other.uid);
}

function useTuningSkill1() {
  const cost = S.tuningSkill1Cost || 40;
  if (S.tuningEnergy < cost) { log("司辰激情不足", "buff"); return; }
  if (S.tuningUsed.s1 >= 1) { log("技能1 本回合已使用", "buff"); return; }
  pushUndo();
  S.tuningEnergy -= cost;
  S.tuningUsed.s1 += 1;
  if (S.tuning === "initial") {
    S.tuningSkill1Cost = Math.min(60, cost + 10);
    S.hand.unshift({ charId: null, skillId: "universal", rank: 0, uid: "uni-" + Math.random().toString(36).slice(2) });
    log("最初的刻度 技能1：生成万能卡", "buff");
  } else {
    const cid = document.getElementById("tuningChar") ? document.getElementById("tuningChar").value : ORDER[0];
    const def = CHARACTERS[cid];
    S.tuningSkill1Cost = Math.min(50, cost + 5);
    S.hand.unshift({ charId: cid, skillId: def.skills[1].id, rank: 1, uid: "tune-" + Math.random().toString(36).slice(2), tuningTemp: true });
    S.hand.unshift({ charId: cid, skillId: def.skills[0].id, rank: 1, uid: "tune-" + Math.random().toString(36).slice(2), tuningTemp: true });
    log("未尽的调律 技能1：生成" + def.name + "两张1阶小技能（回合结束未使用会消失）", "buff");
  }
  render();
}

function useTuningSkill2() {
  const cost = S.tuning === "initial" ? 25 : 0;
  if (S.tuningEnergy < cost) { log("司辰激情不足", "buff"); return; }
  if (S.tuning === "unfinished" && S.tuningUsed.s2 >= 1) { log("未尽的调律 技能2 本回合已使用", "buff"); return; }
  if (S.tuning === "initial") {
    if (!S.hand.some(x => x.skillId !== "ult")) { log("最初的刻度 技能2：没有可替换的非仪式咒语", "buff"); return; }
    pushUndo();
    S.tuningEnergy -= cost;
    randomizeHandRanks();
    log("最初的刻度 技能2：保留阶次，随机替换非仪式咒语", "buff");
  } else {
    let idx = -1;
    for (let i = S.hand.length - 1; i >= 0; i--) {
      if (S.hand[i].skillId !== "ult") { idx = i; break; }
    }
    if (idx === -1) { log("未尽的调律 技能2：没有可移除的非仪式咒语", "buff"); return; }
    pushUndo();
    S.tuningUsed.s2 += 1;
    const card = S.hand[idx];
    const removedName = card.skillId === "universal" ? "万能卡" : (card.skillId === "prep" ? "虚构故事集" : CHARACTERS[card.charId].skills.find(s => s.id === card.skillId).name);
    S.hand.splice(idx, 1);
    addTuningEnergy(10);
    log("未尽的调律 技能2：移除" + removedName + "，司辰激情+10", "buff");
    autoMergeHand();
  }
  render();
}

function randomizeHandRanks() {
  for (const card of S.hand) {
    if (card.skillId === "ult") continue;
    const def = CHARACTERS[ORDER[Math.floor(Math.random() * ORDER.length)]];
    const skill = def.skills[Math.floor(Math.random() * def.skills.length)];
    let oldRank = card.rank;
    if (!oldRank || oldRank < 1) oldRank = 1;
    card.charId = def.id;
    card.skillId = skill.id;
    card.rank = oldRank;
    delete card.tuningTemp;
  }
}

function variantFromCode(code, mode) {
  try {
    const raw = atob(code.replace(/=+$/, "") + "==");
    const b0 = raw.charCodeAt(0);
    const map = RESONANCE_VARIANT_CODE[mode] || {};
    for (const name of Object.keys(map)) {
      if (map[name] === b0) return name;
    }
  } catch (e) { /* ignore */ }
  return "平和";
}

let RESONANCE_INDEX = null;

function buildResonanceIndex() {
  RESONANCE_INDEX = new Map();
  if (!window.RESONANCE_DICT) return;
  for (const mode of Object.keys(window.RESONANCE_DICT)) {
    const mp = window.RESONANCE_DICT[mode];
    for (const key of Object.keys(mp)) {
      RESONANCE_INDEX.set(mp[key].replace(/=+$/, ""), {
        mode,
        counts: key.slice(1, -1).split(",").map(Number),
        raw: mp[key]
      });
    }
  }
}

function findResonanceByCode(code) {
  if (!code) return null;
  if (!RESONANCE_INDEX) buildResonanceIndex();
  const found = RESONANCE_INDEX.get(code.replace(/=+$/, ""));
  if (!found) return null;
  return { mode: found.mode, counts: found.counts, variant: variantFromCode(found.raw, found.mode) };
}

function computeResonanceStats(counts, variantName, mode) {
  const mainOut = (RESONANCE_MODE_VARIANTS[mode] || {})[variantName] || [0, 0, 0, 0, 0, 0, 0];
  const mainSurv = (RESONANCE_MODE_VARIANTS_SURV[mode] || {})[variantName] || [0, 0, 0, 0, 0, 0, 0];
  const block = computeBlockStats(counts, mode);
  const out = block.out.slice();
  const surv = block.surv.slice();
  for (let j = 0; j < 7; j++) {
    out[j] += mainOut[j];
    surv[j] += mainSurv[j];
  }
  const round = x => Math.round(x * 1000) / 10;
  return { out: out.map(round), surv: surv.map(round) };
}

function computeBlockStats(counts, mode) {
  const out = [0, 0, 0, 0, 0, 0, 0];
  const surv = [0, 0, 0, 0, 0, 0, 0];
  for (let i = 0; i < 11; i++) {
    const mult = counts[i] === 4 ? 3.3 : counts[i];
    const attrs = RESONANCE_BLOCK_ATTRS[i];
    const survAttrs = RESONANCE_BLOCK_ATTRS_SURV[i];
    for (let j = 0; j < 7; j++) {
      out[j] += attrs[j] * mult;
      surv[j] += survAttrs[j] * mult;
    }
  }
  const round = x => Math.round(x * 1000) / 10;
  return { out: out.map(round), surv: surv.map(round) };
}

function totalResonanceSlots(counts) {
  let t = 0;
  for (let i = 0; i < 11; i++) t += counts[i] * RESONANCE_BLOCK_SIZE[i];
  return t;
}

function bestResonanceCombo(mode, variantName, direction) {
  if (!window.RESONANCE_DICT || !window.RESONANCE_DICT[mode]) return null;
  const dict = window.RESONANCE_DICT[mode];
  let best = null;
  for (const key of Object.keys(dict)) {
    const counts = key.slice(1, -1).split(",").map(Number);
    const stats = computeResonanceStats(counts, variantName, mode);
    const vec = direction === "surv" ? stats.surv : stats.out;
    const score = vec[0];
    if (!best || score > best.score || (score === best.score && totalResonanceSlots(counts) > totalResonanceSlots(best.counts))) {
      best = { counts, code: dict[key], stats, score };
    }
  }
  return best;
}

function computeResonance15Presets() {
  if (!window.RESONANCE_DICT) return;
  for (const id of Object.keys(RESONANCE)) {
    const mode = CHAR_MODE[id] || "X";
    const best = bestResonanceCombo(mode, "平和", "out");
    if (!best) continue;
    const o = best.stats.out;
    const sv = best.stats.surv;
    RESONANCE15[id].pct = Object.assign({}, RESONANCE15[id].pct, {
      atk: o[0], hp: sv[0], defR: sv[1], defM: sv[2],
      critRate: o[2], critDmg: o[3], traumaUp: o[1],
      spellPower: o[4], ritualPower: o[5], pen: o[6],
      critRes: sv[4], traumaRes: sv[3], critDef: sv[5]
    });
    RESONANCE15[id].code = best.code;
  }
}

function resonanceMain(id, level, variant) {
  const byVariant = (window.RESONANCE_MAIN || {})[id];
  if (!byVariant) return null;
  return (byVariant[variant] || {})[level] || null;
}

function addPct(target, src) {
  for (const k of Object.keys(src || {})) target[k] = (target[k] || 0) + src[k];
  return target;
}

function currentResonance(c) {
  if (c.resonanceMode === "custom") return c.customRes;
  const level = c.resonanceMode === "r15" ? 15 : 10;
  const preset = (window.RESONANCE_PRESETS || {})[c.id] || {};
  const row = preset[level];
  if (row) return { flat: row.flat, pct: Object.assign({}, row.pct) };
  const main = resonanceMain(c.id, level, c.variant);
  if (!main) return c.resonanceMode === "r15" ? RESONANCE15[c.id] : RESONANCE[c.id];
  const pct = { atk: 0, hp: 0, defR: 0, defM: 0, critRate: 0, critDmg: 0, traumaUp: 0, spellPower: 0, ritualPower: 0, pen: 0, critRes: 0, traumaRes: 0, critDef: 0 };
  addPct(pct, main.pct);
  return { flat: main.flat, pct };
}

function importResonanceCode(id) {
  const c = byId(id);
  const input = document.getElementById("resCode-" + id);
  const found = findResonanceByCode((input.value || "").trim());
  if (!found) {
    log("未找到该共鸣码，请从共鸣工具复制完整码", "buff");
    return;
  }
  clearUndoHistory();
  const stats = computeResonanceStats(found.counts, found.variant, found.mode);
  c.resonanceMode = "custom";
  c.variant = found.variant;
  c.customRes.flat = { atk: 0, hp: 0, defR: 0, defM: 0 };
  c.customRes.pct = {
    atk: stats.out[0], hp: stats.surv[0], defR: stats.surv[1], defM: stats.surv[2],
    critRate: stats.out[2], critDmg: stats.out[3], traumaUp: stats.out[1],
    spellPower: stats.out[4], ritualPower: stats.out[5], pen: stats.out[6],
    critRes: stats.surv[4], traumaRes: stats.surv[3], critDef: stats.surv[5]
  };
  log(c.name + " 已导入共鸣码：" + found.mode + " / " + found.variant, "buff");
  refreshStats();
  render();
}

function setPsychube(id, psId) {
  clearUndoHistory();
  byId(id).psychube = psId;
  log("已调整 " + byId(id).name + " 心相：" + PSYCHUBES[psId].name, "buff");
  refreshStats();
  render();
}

function setPortray(id, level) {
  clearUndoHistory();
  const c = byId(id);
  c.portray = +level || 0;
  LAST_PORTRAY[id] = c.portray;
  if (id === "ran") {
    c.energy = c.portray >= 5 ? 100 : (c.portray >= 2 ? 85 : 70);
    c.passion = c.portray >= 1 ? 5 : 3;
  }
  syncUltCard(c);
  log(c.name + " 塑造切换：" + (c.portray === 0 ? "塑造0" : "塑造" + c.portray), "buff");
  refreshStats();
  render();
}

function syncUltCard(c) {
  const hasUlt = S.hand.some(x => x.charId === c.id && x.skillId === "ult");
  if (c.passion >= 5) {
    if (hasUlt) return;
    if (S.hand.length >= handLimit()) {
      const idx = S.hand.findIndex(x => x.skillId !== "ult" && x.skillId !== "prep");
      if (idx >= 0) {
        const removed = S.hand.splice(idx, 1)[0];
        S.deck.push(removed);
        log(c.name + " 大招优先：移回一张普通牌腾出位置", "buff");
      } else {
        return;
      }
    }
    S.hand.unshift({ charId: c.id, skillId: "ult", rank: 0, uid: "ult-" + Math.random().toString(36).slice(2) });
    log(c.name + " 获得至终的仪式卡", "buff");
  } else if (hasUlt) {
    S.hand = S.hand.filter(x => !(x.charId === c.id && x.skillId === "ult"));
    log(c.name + " 激情不足，移除至终的仪式卡", "buff");
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

buildResonanceIndex();
computeResonance15Presets();
newBattle();
</script>
